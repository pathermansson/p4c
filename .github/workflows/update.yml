yaml
name: Update charging dashboard

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch sessions and price them
        env:
          ZAPTEC_USERNAME: ${{ secrets.ZAPTEC_USERNAME }}
          ZAPTEC_PASSWORD: ${{ secrets.ZAPTEC_PASSWORD }}
        run: python update.py
      - name: Commit updated data
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add docs/data.json data/prices_cache.json
          git diff --staged --quiet || git commit -m "Update charging data"
          git push
